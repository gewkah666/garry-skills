<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>行程</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.css">
    <style>
        :root { --bg: #f5f5f7; --fg: #1d1d1f; --muted: #86868b; --line: #e5e5ea; --card: #fff; --accent: #007aff; --warn: #ff9500; --warn-bg: #fff4e5; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
        header { background: linear-gradient(135deg, #1d1d1f 0%, #3a3a3c 100%); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-top: calc(14px + env(safe-area-inset-top)); }
        header h1 { font-size: 20px; font-weight: 600; }
        header .subtitle { opacity: .75; font-size: 13px; }
        .seg { margin-left: auto; display: flex; background: rgba(255,255,255,.14); border-radius: 999px; padding: 3px; }
        .seg button { border: 0; background: transparent; color: #fff; font-size: 13px; padding: 5px 14px; border-radius: 999px; cursor: pointer; opacity: .8; }
        .seg button.active { background: #fff; color: #1d1d1f; opacity: 1; font-weight: 600; }

        /* ---------- 地图模式 ---------- */
        .toolbar { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 500; }
        .chip { padding: 6px 14px; border-radius: 999px; border: 1px solid #d2d2d7; background: var(--card); color: var(--fg); font-size: 13px; cursor: pointer; transition: all .15s; user-select: none; white-space: nowrap; }
        .chip:hover { border-color: var(--accent); color: var(--accent); }
        .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .engine-badge { margin-left: 8px; padding: 3px 10px; border-radius: 999px; font-size: 11px; background: #f0f0f2; color: var(--muted); }
        .legend { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
        .legend .lg-item { display: flex; align-items: center; gap: 4px; }
        .legend .lg-dot { width: 12px; height: 12px; border-radius: 50%; }
        .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 108px); }
        .sidebar { background: var(--card); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
        .day-card { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; overflow: hidden; transition: box-shadow .15s; }
        .day-card.hl { box-shadow: 0 0 0 2px rgba(0,122,255,.5); }
        .day-header { padding: 12px 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .day-color { width: 6px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
        .day-icon { font-size: 20px; }
        .day-title { flex: 1; min-width: 0; }
        .day-title .label { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .day-title .date { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .day-content { max-height: 0; overflow: hidden; transition: max-height .3s; }
        .day-card.open .day-content { max-height: 600px; }
        .stop-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 14px 8px 30px; border-top: 1px solid #f0f0f2; font-size: 12.5px; cursor: pointer; }
        .stop-item:hover { background: #f5f7ff; }
        .stop-item.nogeo { opacity: .55; cursor: default; }
        .stop-time { color: var(--muted); flex-shrink: 0; min-width: 36px; font-variant-numeric: tabular-nums; }
        .stop-name { flex: 1; }
        .map-wrap { position: relative; }
        #map { height: 100%; width: 100%; }
        .detail-card { position: absolute; left: 16px; bottom: 16px; background: rgba(255,255,255,.96); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.14); padding: 14px 18px; max-width: 340px; display: none; z-index: 600; backdrop-filter: blur(6px); }
        .detail-card.show { display: block; }
        .detail-card .dc-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .detail-card .dc-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
        .detail-card .dc-note { font-size: 12.5px; margin: 4px 0; }
        .detail-card .dc-poi { margin-top: 8px; border-top: 1px solid #eee; padding-top: 8px; font-size: 12px; color: #666; max-height: 140px; overflow-y: auto; }
        .detail-card .dc-poi .poi-row { padding: 3px 0; }
        .amap-marker { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); cursor: pointer; }
        .amap-info { font-size: 13px; line-height: 1.6; }
        .amap-info .t { font-weight: 600; }
        .amap-info .s { color: var(--muted); font-size: 12px; }
        a.lnk { font-size: 12px; color: var(--accent); text-decoration: none; }
        .leaflet-popup-content { margin: 10px 14px; line-height: 1.5; }
        .leaflet-container { background: #e8ecf0; }
        @media (max-width: 860px) {
            .layout { grid-template-columns: 1fr; grid-template-rows: 30vh 1fr; }
            .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
            .legend { display: none; }
        }

        /* ---------- 行程模式（手机优先） ---------- */
        #trip { display: none; max-width: 520px; margin: 0 auto; padding: 12px 14px calc(40px + env(safe-area-inset-bottom)); }
        body.mode-trip #trip { display: block; }
        body.mode-trip #mapview { display: none; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { flex-shrink: 0; padding: 8px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13px; cursor: pointer; text-align: center; line-height: 1.25; }
        .tab small { display: block; color: var(--muted); font-size: 11px; }
        .tab.active { border-color: var(--fg); background: var(--fg); color: #fff; }
        .tab.active small { color: rgba(255,255,255,.7); }
        .tab.today { box-shadow: 0 0 0 2px var(--warn); }
        .overview { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
        .overview .ov-title { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .overview .ov-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.6; }
        .overview .ov-route { font-size: 13px; margin-top: 8px; line-height: 1.7; }
        .overview .ov-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .stops { display: flex; flex-direction: column; gap: 10px; }
        .stop { display: grid; grid-template-columns: 52px 1fr; gap: 10px; }
        .stop .t { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 14px; text-align: right; line-height: 1.5; }
        .stop .t b { display: block; color: var(--fg); font-size: 15px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; position: relative; }
        .card.transit { background: #f8f8fa; border-style: dashed; }
        .card .name { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; line-height: 1.4; }
        .card .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
        .card .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .card .chips span { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; background: #f0f0f2; color: #515154; }
        .card .note { margin-top: 10px; font-size: 13px; line-height: 1.55; padding: 8px 10px; border-radius: 10px; background: #f2f7ff; }
        .card .guard { margin-top: 8px; font-size: 13px; line-height: 1.55; padding: 8px 10px; border-radius: 10px; background: var(--warn-bg); color: #8a4b00; font-weight: 500; }
        .card .extra { margin-top: 8px; font-size: 12.5px; color: #515154; line-height: 1.55; }
        .card .extra li { margin-left: 16px; }
        .card .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn { font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.ghost { color: var(--accent); }
        .btn.done { text-decoration: line-through; opacity: .6; }
        .card.done { opacity: .55; }
        .pending { font-size: 11.5px; color: var(--warn); }
        .footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 24px; line-height: 1.7; }
        @media (min-width: 861px) { body.mode-trip header { position: sticky; top: 0; z-index: 10; } }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 id="title">行程</h1>
            <div class="subtitle" id="subtitle"></div>
        </div>
        <div class="seg">
            <button id="btn-map">🗺️ 地图</button>
            <button id="btn-trip">📱 行程</button>
        </div>
    </header>

    <!-- ================= 行程模式 ================= -->
    <section id="trip">
        <div class="tabs" id="tabs"></div>
        <div id="trip-body"></div>
        <div class="footer" id="trip-footer"></div>
    </section>

    <!-- ================= 地图模式 ================= -->
    <section id="mapview">
        <div class="toolbar" id="toolbar">
            <div class="chip active" data-day="all">🗺️ 全部</div>
            <div id="day-chips" style="display:flex;gap:8px;flex-wrap:wrap"></div>
            <span class="engine-badge" id="engine-badge">引擎初始化…</span>
            <div class="legend" id="legend"></div>
        </div>
        <div class="layout">
            <aside class="sidebar" id="sidebar"></aside>
            <div class="map-wrap">
                <div id="map"></div>
                <div class="detail-card" id="detail">
                    <div class="dc-title" id="dc-title">—</div>
                    <div class="dc-meta" id="dc-meta"></div>
                    <div id="dc-notes"></div>
                    <div style="display:flex;gap:10px;margin-top:6px">
                        <a class="lnk" id="dc-nav" target="_blank" href="#">🧭 高德导航</a>
                        <a class="lnk" id="dc-link" target="_blank" href="#">Notion 详情 ↗</a>
                    </div>
                    <div class="dc-poi" id="dc-poi"></div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.bootcdn.net/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const DAY_COLORS = ['#007aff', '#ff9500', '#ff3b30', '#34c759', '#af52de', '#ff2d55', '#5ac8fa', '#ffcc00'];
        const AMAP_TILE = 'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8';

        let tripData = null, engine = null, map = null, currentDay = 'all', dayLayers = {}, mapInited = false;
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
        const dayKey = (d, i) => d.day || `D${i + 1}`;
        const geoStops = d => (d.stops || []).filter(s => s.coords);

        // 导航深链：高德（GCJ-02 坐标，callnative 唤起 App）；Apple 地图在国内同样用 GCJ-02
        const amapNav = (s) => `https://uri.amap.com/navigation?to=${s.coords.lng},${s.coords.lat},${encodeURIComponent(s.place || s.name)}&mode=car&policy=1&src=trip-manager&coordinate=gaode&callnative=1`;
        const appleNav = (s) => `https://maps.apple.com/?daddr=${s.coords.lat},${s.coords.lng}&q=${encodeURIComponent(s.place || s.name)}&dirflg=d`;
        const amapSearch = (s) => `https://uri.amap.com/search?keyword=${encodeURIComponent(s.place || s.name)}&src=trip-manager&callnative=1`;

        // ---------- 初始化 ----------
        async function init() {
            tripData = await (await fetch('./data.json', { cache: 'no-store' })).json();
            const t = tripData.trip;
            document.title = t.title || '行程';
            document.getElementById('title').textContent = t.title || '行程';
            document.getElementById('subtitle').textContent = `${t.start_date} → ${t.end_date} · ${t.days.length} 天`;

            const params = new URLSearchParams(location.search);
            const wantTrip = params.get('mode') === 'trip' || (!params.get('mode') && matchMedia('(max-width: 640px)').matches);
            document.getElementById('btn-map').onclick = () => setMode('map');
            document.getElementById('btn-trip').onclick = () => setMode('trip');
            buildTrip();
            setMode(wantTrip ? 'trip' : 'map');
        }

        function setMode(mode) {
            document.body.classList.toggle('mode-trip', mode === 'trip');
            document.getElementById('btn-map').classList.toggle('active', mode === 'map');
            document.getElementById('btn-trip').classList.toggle('active', mode === 'trip');
            history.replaceState(null, '', mode === 'trip' ? '?mode=trip' : location.pathname);
            if (mode === 'map' && !mapInited) { mapInited = true; initMapMode().catch(console.error); }
            if (mode === 'map' && map && engine === 'leaflet') setTimeout(() => map.invalidateSize(), 50);
        }

        // ================= 行程模式 =================
        let tripDay = null;
        function buildTrip() {
            const days = tripData.trip.days, today = todayStr();
            const tabs = document.getElementById('tabs');
            tabs.innerHTML = days.map((d, i) => `<div class="tab ${d.date === today ? 'today' : ''}" data-i="${i}">${esc(d.icon || '📍')} ${esc(dayKey(d, i))}<small>${esc((d.date || '').slice(5))}</small></div>`).join('');
            tabs.addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) showTripDay(+t.dataset.i); });
            let idx = days.findIndex(d => d.date === today);
            if (idx < 0) idx = days.findIndex(d => d.date > today);
            showTripDay(idx < 0 ? 0 : idx);
            document.getElementById('trip-footer').innerHTML =
                `数据来自 ${tripData.trip.days[0]?.source === 'outlook' ? 'Outlook 日历' : 'Notion 足迹'} · 生成于 ${esc(tripData.trip.generated_at || '')}<br>坐标由高德地理编码得到，未标注坐标的站点请出发前核实`;
        }

        function doneKey(d, s) { return `done:${tripData.trip.title}:${d.date}:${s.time}:${s.name}`; }
        function isDone(d, s) { try { return localStorage.getItem(doneKey(d, s)) === '1'; } catch { return false; } }

        function showTripDay(i) {
            tripDay = i;
            const d = tripData.trip.days[i];
            document.querySelectorAll('.tab').forEach((t, k) => t.classList.toggle('active', k === i));
            const stops = d.stops || [];
            const withGeo = geoStops(d).length;
            const visits = stops.filter(s => !s.is_transit);
            const first = geoStops(d)[0];
            const html = [`
                <div class="overview">
                    <div class="ov-title">${esc(d.icon || '📍')} ${esc(dayKey(d, i))} · ${esc(d.title)}</div>
                    <div class="ov-meta">${esc(d.date)}${d.transport ? ' · ' + esc(d.transport) : ''} · ${visits.length} 站${withGeo < stops.length ? ` · <span class="pending">${stops.length - withGeo} 站无坐标</span>` : ''}</div>
                    ${d.route?.length ? `<div class="ov-route">${d.route.map(esc).join(' → ')}</div>` : ''}
                    <div class="ov-actions">
                        ${first ? `<a class="btn primary" href="${amapNav(first)}">🧭 导航去第一站</a>` : ''}
                        <button class="btn ghost" onclick="openOnMap(${i})">🗺️ 在地图上看</button>
                        ${d.url ? `<a class="btn ghost" href="${esc(d.url)}" target="_blank">Notion ↗</a>` : ''}
                    </div>
                </div>
                <div class="stops">`];
            stops.forEach((s, k) => {
                const done = isDone(d, s);
                const chips = [];
                if (s.is_transit && s.transport) chips.push(esc(s.transport));
                if (!s.is_transit && s.dwell_min) chips.push(`⏱ ${s.dwell_min} 分钟`);
                if (s.cost) chips.push(`💰 ${esc(s.cost)}`);
                if (!s.is_transit && s.location && s.location !== s.name) chips.push(`📍 ${esc(s.location)}`);
                const extras = (s.notes || []).map(n => `<li>${esc(n)}</li>`).join('');
                html.push(`
                <div class="stop">
                    <div class="t"><b>${esc(s.time || '—')}</b>${s.end_time ? esc(s.end_time) : ''}</div>
                    <div class="card ${s.is_transit ? 'transit' : ''} ${done ? 'done' : ''}">
                        <div class="name">${esc(s.icon || '📍')} ${esc(s.name)}</div>
                        ${s.is_transit ? `<div class="sub">${esc(s.origin)} → ${esc(s.destination)}</div>` : (s.coords ? '' : `<div class="sub pending">⚠ 无坐标，导航前先核对地点</div>`)}
                        ${chips.length ? `<div class="chips">${chips.map(c => `<span>${c}</span>`).join('')}</div>` : ''}
                        ${s.note ? `<div class="note">💡 ${esc(s.note)}</div>` : ''}
                        ${s.guard ? `<div class="guard">⚠️ ${esc(s.guard)}</div>` : ''}
                        ${extras ? `<ul class="extra">${extras}</ul>` : ''}
                        <div class="actions">
                            ${s.coords ? `<a class="btn primary" href="${amapNav(s)}">🧭 高德</a><a class="btn" href="${appleNav(s)}">🍎 Apple</a>` : `<a class="btn" href="${amapSearch(s)}">🔍 高德搜索</a>`}
                            ${!s.is_transit ? `<button class="btn ${done ? 'done' : ''}" onclick="toggleDone(${i},${k})">${done ? '已到' : '✓ 到了'}</button>` : ''}
                        </div>
                    </div>
                </div>`);
            });
            html.push('</div>');
            document.getElementById('trip-body').innerHTML = html.join('');
            window.scrollTo({ top: 0 });
        }

        function toggleDone(i, k) {
            const d = tripData.trip.days[i], s = d.stops[k];
            try { localStorage.setItem(doneKey(d, s), isDone(d, s) ? '0' : '1'); } catch {}
            showTripDay(i);
        }

        function openOnMap(i) {
            setMode('map');
            const key = dayKey(tripData.trip.days[i], i);
            const go = () => { const chip = document.querySelector(`#toolbar .chip[data-day="${key}"]`); if (chip) chip.click(); };
            if (map) go(); else setTimeout(go, 1200);
        }

        // ================= 地图模式 =================
        async function initMapMode() {
            buildDayChips(); buildSidebar(); buildLegend();
            let amapKey = '';
            try { amapKey = (await (await fetch('./api/config')).json()).amap_js_key || ''; } catch {}
            if (amapKey) {
                try { await loadAmap(amapKey); initAmapMap(); engine = 'amap'; badge('高德地图'); }
                catch (e) { console.warn('AMap 初始化失败, 回退 Leaflet:', e); initLeafletMap(); engine = 'leaflet'; badge('Leaflet 兜底'); }
            } else { initLeafletMap(); engine = 'leaflet'; badge('Leaflet'); }
            renderDay('all');
        }
        function badge(t) { document.getElementById('engine-badge').textContent = '🗺️ ' + t; }

        function loadAmap(key) {
            return new Promise((resolve, reject) => {
                if (window.AMap) return resolve();
                const s = document.createElement('script');
                s.src = `https://webapi.amap.com/maps?v=2.0&key=${key}&plugin=AMap.Driving`;
                s.onload = () => setTimeout(resolve, 100);
                s.onerror = () => reject(new Error('AMap script load failed'));
                document.head.appendChild(s);
                setTimeout(() => { if (!window.AMap) reject(new Error('AMap load timeout')); }, 9000);
            });
        }

        function popupHtml(wp, day) {
            return `<div class="amap-info"><div class="t">${esc(wp.icon || '📍')} ${esc(wp.name)}</div><div class="s">${esc(day.day || '')} ${esc(wp.time || '')}</div>` +
                (wp.guard ? `<div class="s">⚠️ ${esc(wp.guard)}</div>` : '') +
                `<a class="lnk" href="${amapNav(wp)}" target="_blank">🧭 导航</a>${day.url ? ` &nbsp;<a class="lnk" href="${esc(day.url)}" target="_blank">Notion ↗</a>` : ''}</div>`;
        }

        function initAmapMap() {
            map = new AMap.Map('map', { zoom: 7, center: [101.5, 30.8], viewMode: '2D' });
            tripData.trip.days.forEach((day, i) => {
                const color = DAY_COLORS[i % DAY_COLORS.length];
                const wps = geoStops(day);
                const markers = wps.map((wp, wi) => {
                    const m = new AMap.Marker({
                        position: [wp.coords.lng, wp.coords.lat],
                        content: `<div class="amap-marker" style="background:${color}">${wi + 1}</div>`,
                        offset: new AMap.Pixel(-13, -13), title: `${day.day || ''} ${wp.time || ''} ${wp.name}`,
                    });
                    m.on('click', () => {
                        showDetail(wp, day, color);
                        new AMap.InfoWindow({ content: popupHtml(wp, day), offset: new AMap.Pixel(0, -30) }).open(map, [wp.coords.lng, wp.coords.lat]);
                    });
                    return m;
                });
                dayLayers[dayKey(day, i)] = { lines: [], markers, color, day, wps };
            });
            tripData.trip.days.forEach((day, i) => {
                const Lyr = dayLayers[dayKey(day, i)], wps = Lyr.wps;
                if (wps.length < 2) return;
                const driving = new AMap.Driving({ policy: AMap.DrivingPolicy.LEAST_TIME, hideMarkers: true });
                (async () => {
                    for (let k = 0; k < wps.length - 1; k++) {
                        const from = [wps[k].coords.lng, wps[k].coords.lat], to = [wps[k + 1].coords.lng, wps[k + 1].coords.lat];
                        if (from[0] === to[0] && from[1] === to[1]) continue;
                        await drawDrivingSegment(driving, from, to, Lyr);
                    }
                    if (currentDay === dayKey(day, i) || currentDay === 'all') fitToCurrent();
                })();
            });
        }

        function drawDrivingSegment(driving, from, to, Lyr) {
            return new Promise((resolve) => {
                let done = false;
                const finish = (path) => {
                    if (done) return; done = true;
                    const poly = (path && path.length > 1)
                        ? new AMap.Polyline({ path, strokeColor: Lyr.color, strokeWeight: 5, strokeOpacity: 0.8 })
                        : new AMap.Polyline({ path: [from, to], strokeColor: Lyr.color, strokeWeight: 4, strokeOpacity: 0.6, strokeStyle: 'dashed' });
                    poly.setMap(map); Lyr.lines.push(poly); resolve();
                };
                try {
                    driving.search(from, to, (status, result) => {
                        if (status === 'complete' && result.routes && result.routes[0]) finish(result.routes[0].steps.flatMap(s => s.path || []));
                        else finish(null);
                    });
                    setTimeout(() => finish(null), 12000);
                } catch (e) { finish(null); }
            });
        }

        function initLeafletMap() {
            map = L.map('map', { zoomControl: true, attributionControl: false }).setView([30.8, 101.5], 7);
            L.tileLayer(AMAP_TILE, { subdomains: ['1', '2', '3', '4'], maxZoom: 18 }).addTo(map);
            const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 });
            map.on('tileerror', () => { if (!osm._map) osm.addTo(map); });
            tripData.trip.days.forEach((day, i) => {
                const color = DAY_COLORS[i % DAY_COLORS.length];
                const wps = geoStops(day);
                const markers = wps.map(wp => {
                    const m = L.circleMarker([wp.coords.lat, wp.coords.lng], { radius: 9, color: '#fff', weight: 2.5, fillColor: color, fillOpacity: 0.95 });
                    m.bindPopup(popupHtml(wp, day));
                    m.on('click', () => showDetail(wp, day, color));
                    return m;
                });
                const poly = wps.length > 1 ? L.polyline(wps.map(w => [w.coords.lat, w.coords.lng]), { color, weight: 4, opacity: 0.75 }) : null;
                dayLayers[dayKey(day, i)] = { lines: poly ? [poly] : [], markers, color, day, wps };
            });
        }

        function setLayerVisible(Lyr, on) {
            if (engine === 'amap') { Lyr.markers.forEach(m => m.setMap(on ? map : null)); Lyr.lines.forEach(l => l.setMap(on ? map : null)); }
            else { Lyr.markers.forEach(m => on ? m.addTo(map) : map.removeLayer(m)); Lyr.lines.forEach(l => on ? l.addTo(map) : map.removeLayer(l)); }
        }

        function renderDay(key) {
            currentDay = key;
            Object.entries(dayLayers).forEach(([k, Lyr]) => setLayerVisible(Lyr, key === 'all' || k === key));
            document.querySelectorAll('.day-card').forEach(c => {
                const on = key !== 'all' && c.dataset.day === key;
                c.classList.toggle('hl', on); if (on) c.classList.add('open');
            });
            fitToCurrent(); hideDetail();
        }

        function fitToCurrent() {
            if (!map) return;
            const pts = [];
            Object.entries(dayLayers).forEach(([k, Lyr]) => {
                if (currentDay !== 'all' && k !== currentDay) return;
                Lyr.markers.forEach(m => pts.push(engine === 'amap' ? m.getPosition() : m.getLatLng()));
                Lyr.lines.forEach(l => (engine === 'amap' ? l.getPath() : l.getLatLngs()).forEach(p => pts.push(p)));
            });
            if (!pts.length) return;
            if (engine === 'amap') map.setFitView(pts, false, [60, 60, 60, 60], 12);
            else map.fitBounds(L.latLngBounds(pts).pad(0.15));
        }

        function focusStop(key, idx) {
            document.querySelectorAll('#toolbar .chip').forEach(c => c.classList.toggle('active', c.dataset.day === key));
            renderDay(key);
            const Lyr = dayLayers[key]; if (!Lyr) return;
            const wp = Lyr.day.stops[idx]; if (!wp || !wp.coords) return;
            const m = Lyr.markers[Lyr.wps.indexOf(wp)];
            if (engine === 'amap') { map.setZoomAndCenter(11, [wp.coords.lng, wp.coords.lat], false, 800); if (m) setTimeout(() => AMap.event.trigger(m, 'click'), 900); }
            else { map.flyTo([wp.coords.lat, wp.coords.lng], 11, { duration: 0.8 }); if (m) setTimeout(() => m.openPopup(), 900); }
            showDetail(wp, Lyr.day, Lyr.color);
        }

        function buildDayChips() {
            const chips = document.getElementById('day-chips');
            chips.innerHTML = tripData.trip.days.map((d, i) => `<div class="chip" data-day="${esc(dayKey(d, i))}">${esc(d.icon || '📍')} ${esc(dayKey(d, i))}</div>`).join('');
            document.getElementById('toolbar').addEventListener('click', (e) => {
                const chip = e.target.closest('.chip'); if (!chip) return;
                document.querySelectorAll('#toolbar .chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active'); renderDay(chip.dataset.day);
            });
        }

        function buildSidebar() {
            const sb = document.getElementById('sidebar');
            sb.innerHTML = tripData.trip.days.map((day, i) => `
                <div class="day-card" data-day="${esc(dayKey(day, i))}">
                    <div class="day-header">
                        <div class="day-color" style="background:${DAY_COLORS[i % DAY_COLORS.length]}"></div>
                        <span class="day-icon">${esc(day.icon || '📍')}</span>
                        <div class="day-title">
                            <div class="label">${esc(dayKey(day, i))} · ${esc(day.title)}</div>
                            <div class="date">${esc(day.date)}${day.transport ? ' · ' + esc(day.transport) : ''}</div>
                        </div>
                    </div>
                    <div class="day-content">
                        ${(day.stops || []).map((wp, k) => `
                            <div class="stop-item ${wp.coords ? '' : 'nogeo'}" data-day="${esc(dayKey(day, i))}" data-idx="${k}" title="${wp.coords ? '' : '无坐标'}">
                                <span class="stop-time">${esc(wp.time || '')}</span>
                                <span>${esc(wp.icon || '📍')}</span>
                                <span class="stop-name">${esc(wp.name)}${wp.guard ? ' <span style="color:#c77700">⚠️</span>' : ''}</span>
                            </div>`).join('')}
                    </div>
                </div>`).join('');
            sb.addEventListener('click', (e) => {
                const stop = e.target.closest('.stop-item');
                if (stop) { focusStop(stop.dataset.day, +stop.dataset.idx); return; }
                const card = e.target.closest('.day-card'); if (card) card.classList.toggle('open');
            });
        }

        function buildLegend() {
            document.getElementById('legend').innerHTML = tripData.trip.days.map((d, i) =>
                `<span class="lg-item"><span class="lg-dot" style="background:${DAY_COLORS[i % DAY_COLORS.length]}"></span>${esc(dayKey(d, i))}</span>`).join('');
        }

        function showDetail(wp, day, color) {
            const dc = document.getElementById('detail');
            document.getElementById('dc-title').textContent = `${wp.icon || '📍'} ${wp.name}`;
            document.getElementById('dc-meta').textContent = `${day.day || ''} · ${wp.time || ''}${wp.dwell_min ? ' · 停留 ' + wp.dwell_min + ' 分钟' : ''} · ${wp.coords.lat.toFixed(4)}, ${wp.coords.lng.toFixed(4)}`;
            document.getElementById('dc-notes').innerHTML = (wp.note ? `<div class="dc-note">💡 ${esc(wp.note)}</div>` : '') + (wp.guard ? `<div class="dc-note" style="color:#8a4b00">⚠️ ${esc(wp.guard)}</div>` : '');
            document.getElementById('dc-nav').href = amapNav(wp);
            const link = document.getElementById('dc-link');
            if (day.url) { link.href = day.url; link.style.display = ''; } else { link.style.display = 'none'; }
            document.getElementById('dc-poi').innerHTML = '<div class="poi-row" style="color:#86868b">周边 POI 加载中…</div>';
            dc.classList.add('show');
            loadPOI(wp.coords.lng, wp.coords.lat);
        }
        function hideDetail() { document.getElementById('detail').classList.remove('show'); }

        async function loadPOI(lng, lat) {
            const box = document.getElementById('dc-poi');
            try {
                const data = await (await fetch(`./api/poi?lng=${lng}&lat=${lat}&radius=3000&types=风景名胜|餐饮服务`)).json();
                box.innerHTML = data.pois?.length
                    ? '<div class="poi-row" style="color:#86868b">周边推荐：</div>' + data.pois.slice(0, 5).map(p => `<div class="poi-row">📍 ${esc(p.name)} <span style="color:#aaa">(${esc(p.distance || '')}m)</span></div>`).join('')
                    : '<div class="poi-row" style="color:#86868b">周边暂无 POI</div>';
            } catch (e) { box.innerHTML = '<div class="poi-row" style="color:#86868b">周边加载失败（需 server.py 提供 /api/poi）</div>'; }
        }

        init().catch(e => { console.error(e); document.getElementById('subtitle').textContent = '⚠️ data.json 读取失败：先运行 build_data.py'; });
    </script>
</body>
</html>
